services:
  postgres_db:
    build:
      context: .
      dockerfile: Dockerfile.DB

    restart: always
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jonathan9867"]
      interval: 40s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

